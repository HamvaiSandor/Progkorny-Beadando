<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #30e3ca;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-box {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 450px;
        }
    </style>
</head>
<body>
<div class="register-box">
    <h2 class="mb-4 text-center">User Registration</h2>

    <!-- Sikeres regisztráció üzenet -->
    <div th:if="${param.success}" class="alert alert-success text-center">
        Registration successful!
    </div>

    <form th:action="@{/register}" method="post" th:if="${param.success == null}">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
                <input type="password" id="password" name="password" class="form-control" required>
                <div class="input-group-append">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">Show</button>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-block mt-3">Register</button>
    </form>

    <!-- Vissza a terméklistához gomb, ha regisztráció sikeres -->
    <div th:if="${param.success}" class="text-center mt-3">
        <a th:href="@{/products/list}" class="btn btn-primary">Go to Product List</a>
    </div>
</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById("password");
        pwd.type = pwd.type === "password" ? "text" : "password";
    }
</script>
</body>
</html>

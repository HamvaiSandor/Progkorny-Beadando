<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Product</title>

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Bootstrap JS + dependencies -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <style>
        html, body {
            background-color: #30e3ca; /* Türkizkék háttér */
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mt-5 mb-4">Create Product</h2>

    <form th:action="${product.id} != null ? @{/products/update} : @{/products/create}"
          th:object="${product}" method="post">


        <div class="form-group">
            <label for="id" class="form-label">Azonosító (ID)</label>
            <input type="text" th:field="*{id}" class="form-control" id="id" readonly>
        </div>

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" th:field="*{name}" id="name" class="form-control" placeholder="e.g. Concert Name">
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="text" th:field="*{date}" id="date" class="form-control" placeholder="YYYY.MM.DD">
        </div>

        <div class="form-group">
            <label for="sector">Sector</label>
            <input type="text" th:field="*{sector}" id="sector" class="form-control">
        </div>

        <div class="form-group">
            <label for="availableTickets">Available Tickets</label>
            <input type="number" th:field="*{availableTickets}" id="availableTickets" class="form-control" min="0">
        </div>

        <div class="form-group">
            <label for="price">Price (HUF)</label>
            <input type="number" step="0.01" th:field="*{price}" id="price" class="form-control">
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/products/list}" class="btn btn-secondary">Back to list</a>
            <button type="submit" class="btn btn-success">Save</button>
        </div>

    </form>
</div>
</body>
</html>

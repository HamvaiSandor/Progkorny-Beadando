<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        #orderButton {
            float: right;
            margin-top: 15px;
        }
       html, body {
    background-color: #30e3ca; /* Türkizkék háttér */
}
        input[type=number] {
            width: 70px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mt-5 mb-4">Product List</h1>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Name</th>
            <th>Sector</th>
            <th>Date</th>
            <th>Available Tickets</th>
            <th>Price</th>
            <th>Cart</th>
            <th>Fizetendő ($)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}" th:id="'row-' + ${product.id}">
            <td th:text="${product.name}">Product Name</td>
            <td th:text="${product.sector}">Sector</td>
            <td th:text="${product.date}">Date</td>
            <td th:text="${product.availableTickets}" th:id="'available-' + ${product.id}">0</td>
            <td th:text="${product.price}">0.0</td>
            <td>
                <input type="number" min="0" th:id="'qty-' + ${product.id}" placeholder="" />
            </td>
            <td th:id="'total-' + ${product.id}">0 $</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="6" class="text-right font-weight-bold">Összesen fizetendő:</td>
            <td id="grandTotal" class="font-weight-bold">0 $</td>
        </tr>
        </tfoot>
    </table>

    <button id="orderButton" class="btn btn-success">Order</button>
</div>

<script>
    function updateTotals() {
        let grandTotal = 0;

        $('tbody tr').each(function () {
            const row = $(this);
            const id = row.attr('id').replace('row-', '');
            const qty = parseInt($('#qty-' + id).val());
            const price = parseFloat(row.find('td:nth-child(5)').text());

            if (!isNaN(qty) && qty > 0) {
                const total = qty * price;
                $('#total-' + id).text(total.toFixed(2) + ' $');
                grandTotal += total;
            } else {
                $('#total-' + id).text('0 $');
            }
        });

        $('#grandTotal').text(grandTotal.toFixed(2) + ' $');
    }

    $(document).ready(function () {
        $('#orderButton').click(function () {
            let orders = [];

            $('tbody tr').each(function () {
                const row = $(this);
                const id = row.attr('id').replace('row-', '');
                const qtyInput = $('#qty-' + id);
                const qty = parseInt(qtyInput.val());

                if (!isNaN(qty) && qty > 0) {
                    const availableEl = $('#available-' + id);
                    let available = parseInt(availableEl.text());

                    if (qty <= available) {
                        orders.push({id: id, quantity: qty});
                    } else {
                        alert('You cannot order more tickets than available for product ID: ' + id);
                        qtyInput.val('');
                    }
                }
            });

            if (orders.length === 0) {
                alert('Please enter quantities to order.');
                return;
            }

            $.ajax({
                url: '/products/order',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(orders),
                success: function (response) {
                    // Sikeres rendelés után frissítjük a táblázatot
                    orders.forEach(function(order) {
                        const availableEl = $('#available-' + order.id);
                        let currentAvailable = parseInt(availableEl.text());
                        availableEl.text(currentAvailable - order.quantity);
                        $('#qty-' + order.id).val('');
                        $('#total-' + order.id).text('0 $');
                    });
                    updateTotals();
                    alert('Order placed successfully!');
                },
                error: function () {
                    alert('Error processing your order. Please try again.');
                }
            });
        });

        // Élő frissítés minden mennyiség változásra
        $('input[type=number]').on('input', updateTotals);

        // Nyíl lenyomás figyelése
        $('input[type=number]').on('keydown', function(e) {
            if (e.key === 'ArrowDown') {
                let val = $(this).val();
                if (val === '1') {
                    e.preventDefault();
                    $(this).val('');
                    updateTotals();
                }
            }
        });
    });
</script>
</body>
</html>
